services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rule_engine
      POSTGRES_PASSWORD: rule_engine
      POSTGRES_DB: rule_engine_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rule_engine -d rule_engine_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
